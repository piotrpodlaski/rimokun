  Machine:
    loopIntervalMS: 60
    updateIntervalMS: 200
    heartBeatPrescaleCycles: 4
    commandQueueMaxSize: 16  # max pending commands; excess are rejected with an error response
    homing:
      order:
        - YLeft
        - YRight
        - XLeft
        - XRight
        - Z
      startingDirection:
        XLeft: 1
        XRight: 0
        YLeft: 0
        YRight: 0
        Z: 1
    motion:
      stepsPerRevolution: 1000
      neutralAxisActivationThreshold: 0.05
      speedUpdateAxisDeltaThreshold: 0.02
      autoLockTimeoutMs: 5000
      axes:
        leftArmX:
          invertAxis: true
          slowMaxLinearSpeedMmPerSec: &slowSpeedX 50.0
          fastMaxLinearSpeedMmPerSec: &fastSpeedX 350.0
          stepsPerMm: &stepsMmX 14.15
          slowAcceleration001MsPerKHz: &slowAccelX 300000
          slowDeceleration001MsPerKHz: &slowDeccelX 300000
          fastAcceleration001MsPerKHz: &fastAccelX 150000
          fastDeceleration001MsPerKHz: &fastDeccelX 150000
        leftArmY:
          invertAxis: true
          slowMaxLinearSpeedMmPerSec: &slowSpeedY 10.0
          fastMaxLinearSpeedMmPerSec: &fastSpeedY 60.0
          stepsPerMm: &stepsMmY 200
          slowAcceleration001MsPerKHz: &slowAccelY 100000
          slowDeceleration001MsPerKHz: &slowDeccelY 100000
          fastAcceleration001MsPerKHz: &fastAccelY 50000
          fastDeceleration001MsPerKHz: &fastDeccelY 50000
        rightArmX:
          invertAxis: false
          slowMaxLinearSpeedMmPerSec: *slowSpeedX
          fastMaxLinearSpeedMmPerSec: *fastSpeedX
          stepsPerMm: *stepsMmX
          slowAcceleration001MsPerKHz: *slowAccelX
          slowDeceleration001MsPerKHz: *slowDeccelX
          fastAcceleration001MsPerKHz: *fastAccelX
          fastDeceleration001MsPerKHz: *fastDeccelX
        rightArmY:
          invertAxis: false
          slowMaxLinearSpeedMmPerSec: *slowSpeedY
          fastMaxLinearSpeedMmPerSec: *fastSpeedY
          stepsPerMm: *stepsMmY
          slowAcceleration001MsPerKHz: *slowAccelY
          slowDeceleration001MsPerKHz: *slowDeccelY
          fastAcceleration001MsPerKHz: *fastAccelY
          fastDeceleration001MsPerKHz: *fastDeccelY
        gantryZ:
          invertAxis: false
          slowMaxLinearSpeedMmPerSec: 150.0
          fastMaxLinearSpeedMmPerSec: 500.0
          stepsPerMm: *stepsMmX
          slowAcceleration001MsPerKHz: *slowAccelX
          slowDeceleration001MsPerKHz: *slowDeccelX
          fastAcceleration001MsPerKHz: *fastAccelX
          fastDeceleration001MsPerKHz: *fastDeccelX
    inputMapping:
      safetyON : 8
      button1 : 9
      button2 : 10
      tclProx : 0
      tclOpen : 1
      tclClose: 2
      tcrProx: 3
      tcrOpen: 4
      tcrClose: 5
    outputMapping:
      toolChangerLeft: 4
      toolChangerRight: 5
      heartBeat : 7
      light2 : 1
