classes:
  RobotVisualisation:
    scene:
      width: 4000
      height: 1500
    beams:
      top:
        width: 4000
        height: 160
        color: "#555555"
      left:
        width: &arm_width 40
        height: &arm_height 1500
        color: green
      right:
        width: *arm_width
        height: *arm_height
        color: red
  RimoServer:
    statusAddress: &statusAddr "ipc:///tmp/rimoStatus"
    commandAddress: &commandAddr "ipc:///tmp/rimoCommand"
  RimoClient:
    statusAddress: *statusAddr
    commandAddress: *commandAddr
  Contec:
    ipAddress: "10.1.1.101"
    port : 502
    slaveId: 0
    nDI : 16
    nDO : 8
    nAI : 0 #so far not used
  ControlPanel:
    comm:
      type: "serial"
      serial:
        port: "/dev/ttyACM0"
        baudRate: "BAUD_115200" #libserial naming
        characterSize: "CHAR_SIZE_8"
        flowControl: "FLOW_CONTROL_NONE"
        parity: "PARITY_NONE"
        stopBits: "STOP_BITS_1"
        readTimeoutMS: 200
        lineTerminator: "\\n"
    processing:
      movingAverageDepth: 5
      baselineSamples: 50
      buttonDebounceSamples: 3
  MotorControl:
    forceFunction10ForSingleRegisterWrites: true
    model: "AR-KD2"
    transport:
      type: "rawTcpRtu" # default path for motors
      #type: "serialRtu" # default path for motors
      tcp:
        host: "10.1.1.102"
        port: 4002
      serial:
        device: "/dev/ttyr01"
        baud: 115200
        parity: "E"
        dataBits: 8
        stopBits: 1
    responseTimeoutMS: 100
    connectTimeoutMS: 100
    interRequestDelayMS: 3
    # Only motors in this allowlist can be put into FREE mode from the GUI.
    # Keep the default empty; add explicit motor names (for example, XLeft).
    freeControllableMotors:
      - XLeft
      - XRight
      - ZLeft
      - ZRight
    motors:
      XLeft:
        address: 1
        runCurrent: 1000
        stopCurrent: 500
        startingSpeed: 10
        overloadWarning: 10
        overloadAlarm: 300
        excessivePositionDeviationWarning: 500
        excessivePositionDeviationAlarm: 700
      XRight:
        address: 2
        runCurrent: 1000
        stopCurrent: 500
        startingSpeed: 10
        overloadWarning: 10
        overloadAlarm: 300
        excessivePositionDeviationWarning: 500
        excessivePositionDeviationAlarm: 700
      YLeft:
        address: 3
        runCurrent: 500
        stopCurrent: 500
        startingSpeed: 100
        overloadWarning: 10
        overloadAlarm: 300
        excessivePositionDeviationWarning: 500
        excessivePositionDeviationAlarm: 700
      YRight:
        address: 4
        runCurrent: 500
        stopCurrent: 500
        startingSpeed: 100
        overloadWarning: 10
        overloadAlarm: 300
        excessivePositionDeviationWarning: 500
        excessivePositionDeviationAlarm: 700
      ZLeft:
        address: 5
        runCurrent: 1000
        stopCurrent: 500
        startingSpeed: 10
        overloadWarning: 10
        overloadAlarm: 300
        excessivePositionDeviationWarning: 500
        excessivePositionDeviationAlarm: 700
      ZRight:
        motorRotationDirection: 0
        groupId: 5
        address: 6
        runCurrent: 1000
        stopCurrent: 500
        startingSpeed: 10
        overloadWarning: 10
        overloadAlarm: 300
        excessivePositionDeviationWarning: 500
        excessivePositionDeviationAlarm: 700
  Machine:
    loopIntervalMS: 60
    updateIntervalMS: 200
    heartBeatPrescaleCycles: 4
    commandQueueMaxSize: 16  # max pending commands; excess are rejected with an error response
    homing:
      order:
        - YLeft
        - YRight
        - XLeft
        - XRight
        - Z
      startingDirection:
        XLeft: 0
        XRight: 1
        YLeft: 1
        YRight: 1
        Z: 1
      homeSeekingMode:
        XLeft: 2
        XRight: 2
        YLeft: 2
        YRight: 2
        Z: 2
    motion:
      stepsPerRevolution: 1000
      neutralAxisActivationThreshold: 0.05
      speedUpdateAxisDeltaThreshold: 0.02
      autoLockTimeoutMs: 5000
      axes:
        leftArmX:
          invertAxis: true
          slowMaxLinearSpeedMmPerSec: &slowSpeedX 20.0
          fastMaxLinearSpeedMmPerSec: &fastSpeedX 100.0
          stepsPerMm: &stepsMmX 14.15
          slowAcceleration001MsPerKHz: &slowAccelX 300000
          slowDeceleration001MsPerKHz: &slowDeccelX 300000
          fastAcceleration001MsPerKHz: &fastAccelX 150000
          fastDeceleration001MsPerKHz: &fastDeccelX 150000
        leftArmY:
          invertAxis: true
          slowMaxLinearSpeedMmPerSec: &slowSpeedY 10.0
          fastMaxLinearSpeedMmPerSec: &fastSpeedY 40.0
          stepsPerMm: &stepsMmY 200
          slowAcceleration001MsPerKHz: &slowAccelY 100000
          slowDeceleration001MsPerKHz: &slowDeccelY 100000
          fastAcceleration001MsPerKHz: &fastAccelY 50000
          fastDeceleration001MsPerKHz: &fastDeccelY 50000
        rightArmX:
          invertAxis: false
          slowMaxLinearSpeedMmPerSec: *slowSpeedX
          fastMaxLinearSpeedMmPerSec: *fastSpeedX
          stepsPerMm: *stepsMmX
          slowAcceleration001MsPerKHz: *slowAccelX
          slowDeceleration001MsPerKHz: *slowDeccelX
          fastAcceleration001MsPerKHz: *fastAccelX
          fastDeceleration001MsPerKHz: *fastDeccelX
        rightArmY:
          invertAxis: false
          slowMaxLinearSpeedMmPerSec: *slowSpeedY
          fastMaxLinearSpeedMmPerSec: *fastSpeedY
          stepsPerMm: *stepsMmY
          slowAcceleration001MsPerKHz: *slowAccelY
          slowDeceleration001MsPerKHz: *slowDeccelY
          fastAcceleration001MsPerKHz: *fastAccelY
          fastDeceleration001MsPerKHz: *fastDeccelY
        gantryZ:
          invertAxis: false
          slowMaxLinearSpeedMmPerSec: 20.0
          fastMaxLinearSpeedMmPerSec: 100.0
          stepsPerMm: *stepsMmX
          slowAcceleration001MsPerKHz: *slowAccelX
          slowDeceleration001MsPerKHz: *slowDeccelX
          fastAcceleration001MsPerKHz: *fastAccelX
          fastDeceleration001MsPerKHz: *fastDeccelX
    inputMapping:
      motorPower: 9
      safetyON : 8
      cpuOverride : 10
      tclProx : 0
      tclOpen : 1
      tclClose: 2
      tcrProx: 3
      tcrOpen: 4
      tcrClose: 5
      robotAUX1: 6
      robotAUX2: 7
      localAUX1: 11
      localAUX2: 12
      localAUX3: 13
      localAUX4: 14
      localAUX5: 15
    outputMapping:
      toolChangerLeft: 4
      toolChangerRight: 5
      safetyReset: 0
      heartBeat : 7
      alarmIndicator : 1
